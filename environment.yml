# Phiên bản cố định (mục 2.7). Bộ này đã chạy `make data` + pytest xanh ngày 06/10/2026
# trên Python 3.11. Nâng phiên bản thì chạy lại `make data` rồi mới sửa file này.
name: golub
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas=3.0.6
  - pyarrow=24.0.0
  - numpy=2.4.6
  - scipy=1.17.1
  - statsmodels=0.15.0
  - scikit-learn=1.9.1
  - matplotlib=3.11.2
  - seaborn=0.13.2
  - umap-learn=0.5.12
  - numba=0.68.0
  - pyyaml=6.0.3
  - jupyterlab=4.6.4
  - pytest=9.1.1
  - pip
  - pip:
      - minisom==2.3.6
      - gseapy==1.3.1        # không có trên conda-forge
      - streamlit==1.65.0
